[theme]
primaryColor = "#00D4FF"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#111520"
textColor = "#E2E8F0"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
showErrorDetails = true

[logger]
level = "info"
